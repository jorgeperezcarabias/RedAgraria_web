<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor · Red Agraria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">🌾 Red Agraria — Editor local</span>
      <span class="badge">solo en este Mac</span>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="articulos" class="tab activa">Publicados</button>
      <button data-tab="pendientes" class="tab">Pendientes</button>
      <button data-tab="listo" class="tab">Listo para publicar</button>
    </nav>

    <main id="app">
      <p class="cargando">Cargando…</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
